name: Frontend CI

on:
  pull_request:
    paths:
      - "frontend/**"
      - ".github/workflows/frontend-ci.yml"

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Format, lint, test, and build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Check formatting
        run: npm run format:check

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm test

      - name: Build
        env:
          VITE_PRISM_API_URL: http://localhost:8080
          VITE_PRISM_CHAIN_ID: "31337"
          VITE_PRISM_CHAIN_NAME: Hardhat Local
          VITE_PRISM_RPC_URL: http://127.0.0.1:8545
          VITE_PRISM_POOL_ADDRESS: "0x0000000000000000000000000000000000000001"
          VITE_PRISM_MULTISIG_ADDRESS: "0x0000000000000000000000000000000000000002"
        run: npm run build
